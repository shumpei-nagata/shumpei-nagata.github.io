<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Film Vault 法務情報</title>
    <meta name="description" content="Film Vaultの利用規約、プライバシーポリシー、特定商取引法に基づく表記、免責事項へのリンクです。">
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5ef;
        --surface: #ffffff;
        --text: #1f2428;
        --muted: #687076;
        --line: #ded8cc;
        --accent: #2f6f64;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
        line-height: 1.7;
        color: var(--text);
        background: var(--bg);
      }

      main {
        width: min(100%, 820px);
        margin: 0 auto;
        padding: 56px 20px;
      }

      a {
        color: #204d45;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.18em;
      }

      .back {
        display: inline-flex;
        margin-bottom: 28px;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .lead {
        margin: 0 0 32px;
        color: var(--muted);
      }

      .links {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .links a {
        display: block;
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        font-weight: 700;
        text-decoration: none;
      }

      footer {
        margin-top: 40px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">Film Vaultトップへ</a>
      <h1>Film Vault 法務情報</h1>
      <p class="lead">Film Vaultの利用に関する各種ポリシーと表記を掲載しています。</p>

      <ul class="links">
        <li><a href="./terms_of_service">利用規約</a></li>
        <li><a href="./privacy_policy">プライバシーポリシー</a></li>
        <li><a href="./commercial_law">特定商取引法に基づく表記</a></li>
        <li><a href="./disclaimer">免責事項</a></li>
      </ul>

      <footer>
        <p>Film Vaultは、特定のカメラメーカー、FUJI X Weekly、その他の外部サイトまたは外部サービスが提供、後援、承認、監修、運営するものではありません。</p>
      </footer>
    </main>
  </body>
</html>
